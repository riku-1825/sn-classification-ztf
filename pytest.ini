[pytest]
# Guarantees the repo root is on sys.path for every test, regardless of
# how pytest is invoked (bare `pytest`, `python -m pytest`), the current
# working directory, or any --import-mode setting -- this is pytest's
# own built-in mechanism (supported since pytest 7.0) for exactly the
# "ModuleNotFoundError: No module named 'fetch_real_data'" class of
# failure, and is more robust than the per-test-file sys.path.insert()
# hack (which is still present as a redundant second layer of defense).
pythonpath = .
testpaths = tests
